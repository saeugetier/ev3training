[project]
name = "mjlab-robocup"
version = "0.1.0"
description = "RoboCup dribble-and-kick policy training task for mjlab, targeting EV3 deployment via embedded-nn."
requires-python = ">=3.10"
dependencies = [
  "mjlab",
  "torch",
]

[project.entry-points."mjlab.tasks"]
mjlab_robocup = "mjlab_robocup"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mjlab_robocup"]
