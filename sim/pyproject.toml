[project]
name = "mjlab-robocup"
version = "0.1.0"
description = "RoboCup dribble-and-kick policy training task for mjlab, targeting EV3 deployment via embedded-nn."
requires-python = ">=3.10"
dependencies = [
  "mjlab",
  "torch ==2.13.0",
  "torchvision ==0.28.0",
]

[tool.uv.sources]
torch = [
  { index = "pytorch-cuda", marker = "sys_platform == 'win32'" },
]
torchvision = [
  { index = "pytorch-cuda", marker = "sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cuda"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[project.entry-points."mjlab.tasks"]
mjlab_robocup = "mjlab_robocup"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mjlab_robocup"]
