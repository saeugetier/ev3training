[project]
name = "balance-bot-rl"
version = "0.1.0"
description = "mjlab RL project: two-wheel self-balancing robot (segway) driven by a two-button remote control."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["mjlab>=1.6.0", "torch>=2.7.0", "wandb==0.22.3"]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/uhl/cu128"
explicit = true

[tool.uv. sources]
torch = [
    { index = "pytorch-cu128", marker = "sys platform I= darwin" },
]

[project.entry-points."mjlab.tasks"]
balance_bot = "balance_bot.tasks"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/balance_bot"]

[tool.uv]
package = true
